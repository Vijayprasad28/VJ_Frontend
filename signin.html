<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center> 
    <form action="./submit.html">
        <label for="username">Username:</label>
        <input type="text" placeholder="Username" pattern="[a-z]+[0-9]+@(yahoo|gmail|outlook)+\.(com|at|co|in|org|gov|env)" required=""><br><br>
        <label for="password">Password:</label>
        <input type="password" placeholder="Password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*]){8,16}" required=""><br><br>
        <input type="submit" value="Login"> <br><br>

       
        <a href="./forgotpass.html">Forgot Password?</a> <br><br>

        <label for="signup">Don't have an account?</label>
        <input type="button" value="Sign Up" onclick="window.location.href='./signup.html'"><br><br>
    </center>
    </form>







    </form>
</body>
</html>
