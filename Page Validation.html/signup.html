<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <center>

   
    <form action="./signin.html">
<label for="text">First Name:</label>
<input type="text" id="text" placeholder="First Name" required=""><br><br>
<label for="text">Last Name:</label>
<input type="text" id="text" placeholder="Last Name" required=""><br><br>
<label for="email">Email:</label>
<input type="text" id="email" placeholder="Email" pattern="[a-z]+[0-9]+@(yahoo|gmail|outlook)+\.(com|at|co|in|org|gov|env)" required=""><br><br>
<label for="password">Create Password:</label>
<input type="password" placeholder="Password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*]){8,16}" required=""><br><br>
<label for="password">Re-enter Password:</label>
<input type="password" placeholder="Confirm Password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*]){8,16}" required=""><br><br>
<input type="submit" value="Register">
    </form>

    </center>
</body>
</html>
