<body>
   <center>

    <form action="./signin.html">
     <label for="password">New Password:</label>
        <input type="password" placeholder="New Password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*]){8,16}" required=""><br><br>
     <label for="password">Re-enter Password:</label>
        <input type="password" placeholder="Confirm Password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!@#$%^&*]){8,16}" required=""><br><br>
        <input type="submit" value="Reset Password">
    </form>
   </center>

</body>
